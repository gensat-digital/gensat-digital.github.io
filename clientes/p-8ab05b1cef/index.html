const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(pw){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(P.s),iterations:P.n,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(P.i)},key,u(P.c));return new TextDecoder().decode(pt);}
async function go(pw,silent){const b=document.getElementById('b');b.disabled=true;b.textContent='Abriendo…';
 try{const html=await open_(pw.trim());try{sessionStorage.setItem('gk'+location.pathname,pw.trim())}catch(_){}document.open();document.write(html);document.close();}
 catch(e){if(!silent)document.getElementById('e').textContent='Código incorrecto. Revísalo e intenta de nuevo.';b.disabled=false;b.textContent='Entrar';}}
document.getElementById('f').onsubmit=e=>{e.preventDefault();go(document.getElementById('k').value);};
try{const s=sessionStorage.getItem('gk'+location.pathname);if(s)go(s,true);}catch(_){}
