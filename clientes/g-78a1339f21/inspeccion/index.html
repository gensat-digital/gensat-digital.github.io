<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light only"><meta name="robots" content="noindex, nofollow"><meta name="theme-color" content="#f4f4f2">
<title>Inspección · Productos y Suministros AG</title>
<style>
:root{--bg:#f4f4f2;--s:#fff;--s2:#f9f9f7;--ink:#1d1d1f;--mut:#6e6e73;--line:#e3e3df;--line2:#d4d4cf;--ok:#1e7a47;--bad:#b3372f;--acc:#e04a22}
*{box-sizing:border-box}html,body{margin:0;overflow-x:clip}
body{background:var(--bg);color:var(--ink);font:15px/1.5 Inter,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:8px}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 120px}
.gate{min-height:100dvh;display:grid;place-items:center;padding:24px 16px}
.gc{width:100%;max-width:400px;text-align:center;background:var(--s);border:1px solid var(--line);border-radius:20px;padding:28px 22px 22px;box-shadow:0 10px 30px rgba(0,0,0,.06)}
.gc img{display:block;width:min(220px,60vw);height:auto;margin:0 auto 16px}
.gc h1{font-size:19px;margin:0 0 4px}.gc p{color:var(--mut);margin:0 0 18px;font-size:14px}
.in{width:100%;min-height:48px;padding:10px 12px;border-radius:12px;border:1px solid var(--line2);background:var(--s2);font-size:16px;min-width:0}
.gc .in{text-align:center;font-size:17px;letter-spacing:.06em;text-transform:uppercase}
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 16px;border-radius:12px;border:1px solid var(--line2);background:var(--s);font-weight:650;font-size:15px;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:#fff}.btn.w{width:100%}.btn:disabled{opacity:.6}
.btn.dan{color:var(--bad);border-color:transparent;background:none}
.err{color:var(--bad);font-size:13.5px;min-height:20px;margin-top:10px}
.top{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--s);border-bottom:1px solid var(--line)}
.top img{width:56px;height:auto}.top b{display:block;font-size:15px}.top small{display:block;color:var(--mut);font-size:12.5px}
h1.t{font-size:22px;margin:18px 0 2px;letter-spacing:-.01em}.sub{color:var(--mut);margin:0 0 14px}
h2{font-size:16px;margin:22px 0 8px}
.card{background:var(--s);border:1px solid var(--line);border-radius:16px;padding:16px}
.nec{white-space:pre-wrap;background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:12px;margin:0}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:14px;margin-bottom:12px}.kv dt{color:var(--mut)}.kv dd{margin:0}
.it{margin-top:12px}.ih{display:flex;align-items:center;gap:8px;margin-bottom:8px}.ih b{flex:1}
.f{display:block;margin-bottom:10px}.f span{display:block;font-size:13px;font-weight:600;color:#3a3a3c;margin-bottom:4px}
textarea.in{min-height:84px;resize:vertical;line-height:1.4}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ph{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}.ph .th{position:relative;width:96px;height:96px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}.ph .th button{position:absolute;top:4px;right:4px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;font-size:14px}
.up{display:flex;align-items:center;justify-content:center;width:96px;height:96px;border:1.5px dashed var(--line2);border-radius:10px;cursor:pointer;color:var(--mut);font-size:12.5px;text-align:center;font-weight:600;padding:6px}
.up input{position:absolute;width:1px;height:1px;opacity:0}.up:focus-within{outline:3px solid var(--acc);outline-offset:2px}
.tt{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums;font-weight:700;margin-top:4px}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.bar .in2{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:12px}.bar .sum{flex:1;min-width:0}.bar small{display:block;color:var(--mut);font-size:12px}.bar b{font-size:19px;font-variant-numeric:tabular-nums}
.note{color:var(--mut);font-size:13px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;z-index:50;max-width:90vw;text-align:center}
.demo{background:var(--ink);color:#fff;text-align:center;font-size:11.5px;font-weight:600;padding:5px 12px}
.pdoc{width:816px;background:#fff;color:#111;padding:40px 48px;font:13px/1.35 Calibri,Carlito,Arial,sans-serif}
.pdoc .h{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #2f3236;padding-bottom:10px;margin-bottom:14px}.pdoc .h img{width:110px;height:auto}
.pdoc h3{margin:0;font-size:22px;letter-spacing:.04em}.pdoc .m{display:grid;grid-template-columns:1fr 1fr;gap:4px 24px;margin-bottom:12px}
.pdoc .ni{border:1px solid #ccc;border-radius:4px;padding:10px 12px;margin-bottom:12px;break-inside:avoid;page-break-inside:avoid}
.pdoc .ni .r{display:flex;justify-content:space-between;gap:12px}.pdoc .pp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.pdoc .pp div{height:150px;background:#eee center/cover no-repeat;border:1px solid #ddd}
.pdoc .tot{display:flex;justify-content:flex-end;gap:24px;font-size:16px;font-weight:700;border-top:2px solid #2f3236;padding-top:8px}
.pdoc .ft{margin-top:24px;font-size:10px;color:#888;text-align:center}
.off{position:absolute;left:-10000px;top:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>

const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
const n2=n=>(+n||0).toLocaleString('es-VE',{minimumFractionDigits:2,maximumFractionDigits:2});
const money=n=>'$'+(+n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
function toast(m){document.querySelectorAll('.toast').forEach(e=>e.remove());const e=document.createElement('div');e.className='toast';e.setAttribute('role','status');e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),2600);}
const b64u=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
const nk=s=>s.trim().toUpperCase().replace(/[\s-]+/g,'');
async function dec(code){const raw=b64u(location.hash.slice(1)),salt=raw.slice(0,16),iv=raw.slice(16,28),ct=raw.slice(28);
 const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(nk(code)),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:100000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
 return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct)));}
/* almacenamiento local de la propuesta (IndexedDB) */
const IDB=new Promise(ok=>{try{const r=indexedDB.open('ag-insp',1);r.onupgradeneeded=()=>r.result.createObjectStore('s');r.onsuccess=()=>ok(r.result);r.onerror=()=>ok(null);}catch(_){ok(null)}});
async function sget(k){const d=await IDB;if(!d)return null;return new Promise(ok=>{const r=d.transaction('s').objectStore('s').get(k);r.onsuccess=()=>ok(r.result||null);r.onerror=()=>ok(null);});}
async function sput(k,v){const d=await IDB;if(!d)return;return new Promise(ok=>{const t=d.transaction('s','readwrite');t.objectStore('s').put(v,k);t.oncomplete=ok;t.onerror=ok;});}
const shrink=f=>new Promise(ok=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1280/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(im.src);ok(c.toDataURL('image/jpeg',.8));};im.onerror=()=>ok('');im.src=URL.createObjectURL(f);});
let A=null,S=null;const UN=['M2','ML','UND','SG','PTO','M3','KG'];
const save=()=>sput(A.id,S);
const total=()=>S.items.reduce((s,x)=>s+Math.round((+x.q||0)*(+x.pu||0)*100)/100,0);

function gate(){const ok=location.hash.length>40;
 $('app').innerHTML=`<div class="gate"><form class="gc" id="gf"><img src="${AGPNG}" width="600" height="403" alt="Productos y Suministros AG, C.A."><h1>Inspección para Productos y Suministros AG</h1>
 <p>${ok?'Escriba el código que le enviaron para ver el trabajo asignado.':'Este enlace no está completo. Pida a Productos y Suministros AG que se lo envíe de nuevo.'}</p>
 ${ok?`<input class="in" id="gk" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Código" aria-label="Código de acceso" required><button class="btn pri w" style="margin-top:10px" id="gb">Entrar</button><div class="err" id="ge" role="alert"></div>`:''}
 <p class="note" style="margin:14px 0 0">Solo verá lo que AG le asignó. DEMO hecha por GENSAT LLC.</p></form></div>`;
 if(!ok)return;$('gf').onsubmit=async e=>{e.preventDefault();const b=$('gb');b.disabled=true;b.textContent='Abriendo…';
  try{A=await dec($('gk').value);try{sessionStorage.setItem('agi'+location.hash.slice(1,20),nk($('gk').value))}catch(_){}await boot();}catch(_){$('ge').textContent='Código incorrecto. Revíselo e intente de nuevo.';b.disabled=false;b.textContent='Entrar';}};}
async function boot(){S=await sget(A.id)||{nom:A.sub&&A.sub.nom||'',tel:A.sub&&A.sub.tel||'',hall:'',dias:'',items:[{d:'',u:'M2',q:'',pu:'',f:[]}]};draw();}
function draw(){const y=scrollY;
 $('app').innerHTML=`<div class="demo">DEMO · no oficial · hecho por GENSAT LLC</div><div class="top"><img src="${AGPNG}" width="600" height="403" alt="Productos y Suministros AG"><div><b>Productos y Suministros AG</b><small>Inspección ${esc(A.n)} · acceso solo para ${esc(A.sub&&A.sub.nom||'el subcontratista')}</small></div></div>
 <div class="wrap"><h1 class="t">${esc(A.of||'Inspección')} · ${esc(A.cap)}</h1><p class="sub">Revise el sitio, tome fotos de lo que encontró y ponga su precio por cada trabajo.</p>
 <div class="card"><dl class="kv"><dt>Lugar</dt><dd>${esc(A.cap)}${A.dir?' · '+esc(A.dir):''}</dd><dt>Fecha</dt><dd>${esc(A.fecha||'')}</dd>${A.cto?`<dt>Contacto en sitio</dt><dd>${esc(A.cto)}</dd>`:''}</dl>
 <p style="margin:0 0 6px;font-weight:600">Lo que pide revisar AG</p><p class="nec">${esc(A.nec||'—')}</p></div>
 <h2>Sus datos</h2><div class="card"><div class="g3" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr)"><label class="f"><span>Nombre</span><input class="in" data-s="nom" value="${esc(S.nom)}"></label><label class="f"><span>Teléfono</span><input class="in" data-s="tel" type="tel" value="${esc(S.tel)}"></label></div>
 <label class="f"><span>Lo que encontró (en general)</span><textarea class="in" data-s="hall" placeholder="Ej: puertas hinchadas por humedad, bisagras flojas">${esc(S.hall)}</textarea></label>
 <label class="f" style="margin:0"><span>Días que necesita para hacer el trabajo</span><input class="in" data-s="dias" type="number" inputmode="numeric" value="${esc(S.dias)}" style="max-width:160px"></label></div>
 <h2>Trabajos y precios</h2>
 ${S.items.map((x,i)=>`<div class="card it"><div class="ih"><b>Trabajo ${i+1}</b>${S.items.length>1?`<button type="button" class="btn dan" data-rm="${i}">Quitar</button>`:''}</div>
  <div class="ph">${x.f.map((src,j)=>`<div class="th"><img src="${src}" width="96" height="96" alt="Foto ${j+1} del trabajo ${i+1}"><button type="button" data-rf="${i}|${j}" aria-label="Quitar foto">✕</button></div>`).join('')}<label class="up">＋ Foto<input type="file" accept="image/*" multiple data-up="${i}"></label></div>
  <label class="f"><span>Descripción</span><textarea class="in" data-i="${i}" data-k="d" placeholder="Ej: Mantenimiento de puerta de madera: lijado, sellador y barniz">${esc(x.d)}</textarea></label>
  <div class="g3"><label class="f"><span>Unidad</span><select class="in" data-i="${i}" data-k="u">${UN.map(u=>`<option ${x.u===u?'selected':''}>${u}</option>`).join('')}</select></label><label class="f"><span>Cantidad</span><input class="in" data-i="${i}" data-k="q" type="number" inputmode="decimal" value="${esc(x.q)}"></label><label class="f"><span>Precio unit. $</span><input class="in" data-i="${i}" data-k="pu" type="number" inputmode="decimal" value="${esc(x.pu)}"></label></div>
  <div class="tt"><span>Total del trabajo</span><span id="it${i}">${money((+x.q||0)*(+x.pu||0))}</span></div></div>`).join('')}
 <button type="button" class="btn w" id="add" style="margin-top:12px">＋ Agregar otro trabajo</button>
 <p class="note">Todo se guarda en este teléfono mientras escribe. Cuando termine, toque "Enviar a AG": se crea un PDF con sus fotos y precios para mandarlo por WhatsApp.</p></div>
 <div class="bar"><div class="in2"><div class="sum"><small>Total de su propuesta</small><b id="tot">${money(total())}</b></div><button type="button" class="btn pri" id="send">Enviar a AG</button></div></div>`;
 scrollTo(0,y);
 document.querySelectorAll('[data-s]').forEach(e=>e.oninput=()=>{S[e.dataset.s]=e.value;save();});
 document.querySelectorAll('[data-k]').forEach(e=>e.oninput=e.onchange=()=>{const x=S.items[+e.dataset.i];x[e.dataset.k]=e.value;save();$('it'+e.dataset.i).textContent=money((+x.q||0)*(+x.pu||0));$('tot').textContent=money(total());});
 document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{if(!b.dataset.ok){b.dataset.ok=1;b.textContent='¿Seguro?';return;}S.items.splice(+b.dataset.rm,1);save();draw();});
 document.querySelectorAll('[data-rf]').forEach(b=>b.onclick=()=>{const [i,j]=b.dataset.rf.split('|');S.items[+i].f.splice(+j,1);save();draw();});
 document.querySelectorAll('[data-up]').forEach(inp=>inp.onchange=async()=>{const x=S.items[+inp.dataset.up];toast('Procesando fotos…');for(const fl of inp.files){const s=await shrink(fl);if(s)x.f.push(s);}save();draw();});
 $('add').onclick=()=>{S.items.push({d:'',u:'M2',q:'',pu:'',f:[]});save();draw();const t=document.querySelectorAll('[data-k=d]');t[t.length-1].focus();};
 $('send').onclick=send;}
function pdoc(){return `<div class="pdoc"><div class="h"><div><h3>PROPUESTA DE SUBCONTRATISTA</h3><div>Inspección ${esc(A.n)} · ${esc(A.of||'')} · ${esc(A.cap)}</div></div><img src="${AGPNG}" width="600" height="403" alt=""></div>
 <div class="m"><div><b>Para:</b> Productos y Suministros AG, C.A.</div><div><b>Fecha:</b> ${new Date().toLocaleDateString('es-VE')}</div><div><b>De:</b> ${esc(S.nom)}</div><div><b>Teléfono:</b> ${esc(S.tel)}</div>${S.dias?`<div><b>Tiempo de ejecución:</b> ${esc(S.dias)} días</div>`:''}</div>
 ${S.hall?`<p><b>Lo que encontró:</b> ${esc(S.hall)}</p>`:''}
 ${S.items.map((x,i)=>`<div class="ni"><div class="r"><b>${i+1}. ${esc(x.d)}</b><b>${money((+x.q||0)*(+x.pu||0))}</b></div><div>${n2(x.q)} ${esc(x.u)} × ${money(x.pu)}</div>${x.f.length?`<div class="pp">${x.f.map(s=>`<div style="background-image:url('${s}')"></div>`).join('')}</div>`:''}</div>`).join('')}
 <div class="tot"><span>TOTAL DE LA PROPUESTA</span><span>${money(total())}</span></div>
 <div class="ft">Generado con la app DEMO de GENSAT LLC para Productos y Suministros AG. Este archivo se puede importar en la app de AG.</div></div>`;}
let H2P=null;const loadH2P=()=>window.html2pdf?Promise.resolve():H2P||(H2P=new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js';s.onload=ok;s.onerror=()=>{H2P=null;no();};document.head.appendChild(s);}));
const u8b64=u=>{let s='';for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s);};
async function send(e){const b=e.currentTarget;
 const it=S.items.filter(x=>(x.d||'').trim());if(!it.length){toast('Escriba al menos un trabajo con su descripción');return;}if(it.some(x=>!(+x.q)||!(+x.pu))){toast('Ponga cantidad y precio a cada trabajo');return;}if(!S.nom.trim()){toast('Escriba su nombre');return;}
 b.disabled=true;b.textContent='Preparando…';
 try{await loadH2P();const tmp=document.createElement('div');tmp.className='off';tmp.innerHTML=pdoc();document.body.appendChild(tmp);
  let pdf;try{pdf=await html2pdf().set({margin:[20,0,20,0],image:{type:'jpeg',quality:.9},html2canvas:{scale:2,scrollX:0,scrollY:0,backgroundColor:'#ffffff'},jsPDF:{unit:'px',format:[816,1056],hotfixes:['px_scaling']},pagebreak:{mode:['css'],avoid:['.ni']}}).from(tmp.firstElementChild).outputPdf('arraybuffer');}finally{tmp.remove();}
  const data={t:'ag-insp',v:1,id:A.id,n:A.n,cap:A.cap,of:A.of,fecha:new Date().toISOString(),nom:S.nom,tel:S.tel,hall:S.hall,dias:S.dias,items:it};
  const tail=new TextEncoder().encode('\n%AGDATA '+u8b64(new TextEncoder().encode(JSON.stringify(data)))+'\n');
  const blob=new Blob([pdf,tail],{type:'application/pdf'});const fn=('Propuesta '+A.n+' '+(A.of||'')+' '+S.nom).replace(/[^\wÁÉÍÓÚáéíóúÑñ .-]/g,'').trim().slice(0,80)+'.pdf';
  const f=new File([blob],fn,{type:'application/pdf'});
  if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:fn.replace('.pdf',''),text:'Propuesta para Productos y Suministros AG · '+A.n}).catch(()=>{});}
  else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fn;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000);toast('PDF descargado: envíelo a AG por WhatsApp');}}
 catch(_){toast('No se pudo crear el PDF. Revise su conexión e intente de nuevo.');}
 b.disabled=false;b.textContent='Enviar a AG';}
(async()=>{gate();try{const k=sessionStorage.getItem('agi'+location.hash.slice(1,20));if(k&&location.hash.length>40){A=await dec(k);await boot();}}catch(_){}})();
</script></body></html>
